<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando... — Selbstor|Achadinhos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================
   CSS VARIABLES — Defaults (overridden by spreadsheet)
   ============================================ */
    :root {
      --primary: #2A5C3F;
      --primary-rgb: 42, 92, 63;
      --primary-light: rgba(42, 92, 63, 0.08);
      --primary-hover: #1E4530;
      --secondary: #1B1B1B;
      --secondary-hover: #000000;
      --secondary-light: rgba(27, 27, 27, 0.08);
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-50: #F7F7F5;
      --gray-100: #EFEFEC;
      --gray-200: #E0DED9;
      --gray-300: #C8C5BE;
      --gray-400: #A8A49C;
      --gray-500: #87837A;
      --gray-600: #6B6760;
      --gray-700: #4A4740;
      --gray-800: #2D2B27;
      --text: #1B1B1B;
      --text-muted: #6B6760;
      --text-light: #87837A;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
      --font: 'DM Sans', -apple-system, sans-serif;
    }

    /* ============================================
   RESET & BASE
   ============================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }

    body.modal-open {
      position: fixed;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      cursor: pointer;
      font-family: var(--font);
      border: none;
    }

    input,
    select,
    textarea {
      font-family: var(--font);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ============================================
   LOADING SCREEN
   ============================================ */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ============================================
   ERROR SCREEN
   ============================================ */
    .error-screen {
      display: none;
      max-width: 500px;
      margin: 80px auto;
      padding: 40px;
      text-align: center;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--gray-200);
    }

    .error-screen.show {
      display: block;
    }

    .error-screen h2 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .error-screen p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .top-bar {
      background: var(--top-bar-bg, var(--primary));
      color: var(--white);
      text-align: center;
      padding: 8px 20px;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      display: none;
    }
    .top-bar.show { display: block; }

    /* ============================================
   HEADER
   ============================================ */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
      gap: 16px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-logo img {
      max-height: 44px;
      max-width: 160px;
      width: auto;
      height: auto;
      border-radius: 6px;
      object-fit: contain;
    }

    .header-logo span {
      font-weight: 700;
      font-size: 1.15rem;
      color: #1B1B1B;
      letter-spacing: -0.02em;
    }

    .search-clear {
      display: none !important;
    }
    .search-clear.show {
      display: flex !important;
    }

    .search-bar {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 36px 10px 42px;
      border: 1.5px solid var(--gray-200);
      border-radius: 50px;
      font-size: 0.9rem;
      background: var(--gray-50);
      transition: var(--transition);
      color: var(--text);
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-bar input::placeholder {
      color: var(--gray-400);
    }

    .search-bar svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      width: 18px;
      height: 18px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .channel-btn {
      display: none;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: var(--white);
      padding: 10px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
      white-space: nowrap;
    }

    .channel-btn.show {
      display: flex;
    }

    .channel-btn:hover {
      filter: brightness(0.93);
      transform: translateY(-1px);
    }

    .channel-btn.telegram {
      background: #229ED9;
    }

    .channel-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .admin-btn {
      background: none;
      color: var(--gray-700);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .admin-btn:hover {
      background: var(--gray-100);
    }

    .admin-btn svg {
      width: 22px;
      height: 22px;
    }

    .admin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-overlay.open {
      display: flex;
    }

    .admin-box {
      background: var(--white);
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 24px;
      position: relative;
    }

    .admin-box h3 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .admin-box label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    .admin-box input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--font);
      margin-bottom: 14px;
      background: var(--white);
      color: var(--text);
      outline: none;
    }

    .admin-box input:focus {
      border-color: var(--primary);
    }

    .admin-erro {
      color: #DC2626;
      font-size: 0.82rem;
      margin: -4px 0 12px;
      display: none;
    }

    .admin-erro.show {
      display: block;
    }

    .admin-acoes {
      display: flex;
      gap: 10px;
    }

    .admin-acoes button {
      flex: 1;
      padding: 11px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .admin-acoes .admin-cancelar {
      background: var(--gray-100);
      color: var(--gray-700);
    }

    .admin-acoes .admin-entrar {
      background: var(--primary);
      color: var(--white);
    }

    .admin-acoes .admin-entrar:hover {
      background: var(--primary-hover);
    }

    .search-toggle {
      display: none;
      background: none;
      color: var(--gray-700);
      padding: 8px;
    }

    .search-toggle svg {
      width: 22px;
      height: 22px;
    }

    /* ============================================
   CATEGORY NAV
   ============================================ */
    .cat-nav {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
    }

    .cat-nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .cat-nav-inner::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      padding: 12px 18px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
      letter-spacing: -0.01em;
    }

    .cat-btn:hover {
      color: var(--text);
    }

    .cat-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* ============================================
   SUBCATEGORY FILTER
   ============================================ */
    .subcat-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px 0;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subcat-bar.show {
      display: flex;
    }

    .subcat-btn {
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: 50px;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .subcat-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .subcat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    /* ============================================
   BANNER
   ============================================ */
    .banner {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: none;
    }

    .banner.show {
      display: block;
    }

    .banner a,
    .banner div.banner-wrap {
      display: block;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
    }

    .banner-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.85) 0%, rgba(var(--primary-rgb), 0.3) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 48px;
    }

    .banner-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
    }

    .banner-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .banner-sub {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ============================================
   PRODUCTS GRID
   ============================================ */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--secondary);
    }

    .product-count {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--gray-100);
      transition: var(--transition);
      cursor: default;
      position: relative;
    }

    .product-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--gray-200);
    }

    .product-img-wrap {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--gray-50);
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img-wrap img {
      transform: scale(1.05);
    }

    .badge-promo {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #E53E3E;
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .product-info {
      padding: 14px 16px 16px;
    }

    .product-cat {
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-light);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      display: flex;
      align-items: baseline;
      gap: 8px;
      row-gap: 0;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .price-current {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    .price-old {
      font-size: 0.85rem;
      color: var(--gray-400);
      text-decoration: line-through;
      white-space: nowrap;
    }

    .btn-details {
      width: 100%;
      padding: 10px;
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      transition: var(--transition);
    }

    .btn-details:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .btn-details.btn-shopee:hover {
      background: #EE4D2D;
      border-color: #EE4D2D;
      color: #fff;
    }

    .btn-details.btn-amazon:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .btn-details.btn-tiktok:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .btn-details.btn-meli:hover {
      background: #FFE600;
      border-color: #FFE600;
      color: #2D3277;
      font-weight: 700;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .no-results svg {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      color: var(--gray-300);
    }

    /* ============================================
   PRODUCT DETAIL MODAL
   ============================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: var(--gray-600);
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .modal-close:hover {
      background: var(--gray-50);
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-left {
      display: flex;
      flex-direction: column;
    }

    .modal-gallery {
      aspect-ratio: 1;
      background: var(--gray-50);
      overflow: hidden;
    }

    .modal-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-thumbs {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      justify-content: center;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
    }

    .gallery-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.2s ease;
      background: var(--white);
      flex-shrink: 0;
    }
    .gallery-thumb:hover { opacity: 0.9; }
    .gallery-thumb.active { border-color: var(--primary); opacity: 1; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .modal-details {
      padding: 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 100%;
    }

    .modal-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--secondary);
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .modal-price {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .modal-price .price-current {
      font-size: 1.5rem;
    }

    .modal-price .price-old {
      font-size: 1rem;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 24px;
      flex: 1;
      white-space: pre-line;
    }

    .coupon-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1.5px dashed var(--primary);
      background: var(--primary-light);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .coupon-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .coupon-code {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--primary);
    }

    .coupon-copy {
      background: var(--primary);
      color: var(--white);
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      transition: var(--transition);
    }

    .coupon-copy:hover {
      background: var(--primary-hover);
    }

    .video-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      margin-bottom: 20px;
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .btn-cta {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: var(--white);
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .btn-cta:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);

  <script>
    // ============================================
    // APP ENGINE — Planiloja Achadinhos
    // ============================================

    // State
    let CONFIG = {};
    let PRODUCTS = [];
    let activeCategory = "Todos";
    let activeSubcategory = null;
    let currentProduct = null;

    // ============================================
    // CSV PARSER
    // ============================================
    function parseCSV(text) {
      const lines = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (inQuotes && text[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          lines.push(current); current = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          lines.push(current); current = ''; lines.push('\n');
        } else { current += ch; }
      }
      if (current) lines.push(current);

      const rows = [];
      let row = [];
      for (const token of lines) {
        if (token === '\n') { if (row.length > 0) rows.push(row); row = []; }
        else { row.push(token.trim()); }
      }
      if (row.length > 0) rows.push(row);
      return rows;
    }

    // ============================================
    // LOAD CONFIG FROM SHEETS
    // ============================================
    async function loadConfig() {
      const res = await fetch(ACHADINHOS.planilha_configuracoes + '&_t=' + Date.now(), { cache: 'no-store' });
      const text = await res.text();
      const rows = parseCSV(text);

      const cfg = {};

      for (const row of rows) {
        if (!row[0] && !row[1]) continue;
        const field = (row[0] || '').replace(/[⚙️📋🎨🚚🏷️💳💡]/g, '').trim().toUpperCase();
        const val = (row[1] || '').trim();

        if (field === 'CAMPO' || field === 'VALOR' || field === 'INSTRUÇÕES' || field === '') continue;
        if (field.includes('CONFIGURAÇÕES') || field.includes('PREENCHA')) continue;
        if (field.includes('DADOS DA LOJA') || field.includes('PERSONALIZAÇÃO') || field.includes('CANAL DE OFERTAS') || field.includes('AVISOS')) continue;

        if (field === 'NOME DA LOJA') cfg.storeName = val;
        else if (field === 'LOGO (URL)') cfg.logo = val;
        else if (field === 'INSTAGRAM') cfg.instagram = val;

    // ============================================
    // LOAD CATÁLOGO FROM SHEETS
    // ============================================
    async function loadCatalogo() {
      const res = await fetch(ACHADINHOS.planilha_catalogo + '&_t=' + Date.now(), { cache: 'no-store' });
      const text = await res.text();
      const rows = parseCSV(text);

      const products = [];
      for (const row of rows) {
        const first = (row[0] || '').trim().toUpperCase();
        if (!first || first === 'ATIVO' || first === 'ATIVO *' || first === 'SIM OU NÃO' || first.includes('CATÁLOGO') || first.includes('CATALOGO') || first.includes('CADA LINHA') || first.includes('DICAS')) continue;
        if (first !== 'SIM') continue;

        products.push({
          ativo: true,
          tipo: ((row[1] || '').trim().toUpperCase() === 'DIGITAL') ? 'DIGITAL' : 'FISICO',
          plataforma: (row[2] || '').trim(),
          categoria: (row[3] || '').trim(),
          subcategoria: (row[4] || '').trim(),
          nome: (row[5] || '').trim(),
          descricao: (row[6] || '').trim(),
          preco: parsePrecoBR(row[7]),
          precoPromo: row[8] ? (parsePrecoBR(row[8]) || null) : null,
          cupom: (row[9] || '').trim(),
          validade: parseDataBR(row[10]),
          linkAfiliado: (row[11] || '').trim(),
          textoBotao: (row[12] || '').trim(),
          video: (row[13] || '').trim(),
          img1: fixImg((row[14] || '').trim()),
          img2: fixImg((row[15] || '').trim()),
          img3: fixImg((row[16] || '').trim()),
          img4: fixImg((row[17] || '').trim()),
          ordem: parseInt(row[18]) || 9999,
          destaque: row.length > 19 && (row[19] || '').trim().toUpperCase() === 'SIM',
        });
      }
      PRODUCTS = products.filter(p => p.nome && p.linkAfiliado && ofertaValida(p));
    }

    function parseDataBR(val) {
      var s = (val || '').trim();
      if (!s) return null;
      var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!m) return null;
      var d = new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10), 23, 59, 59);
      return isNaN(d.getTime()) ? null : d;
    }

    function ofertaValida(p) {
      if (!p.validade) return true;
      return new Date() <= p.validade;
    }

    function ofertaExpiraEmBreve(p) {
      if (!p.validade) return false;
      var diff = p.validade.getTime() - Date.now();
      return diff > 0 && diff <= 48 * 60 * 60 * 1000;
    }

    // ============================================
    function getCategories() {
      return ["Todos", ...new Set(PRODUCTS.map(p => p.categoria).filter(Boolean))];
    }
    function getSubcategories(cat) {
      return [...new Set(PRODUCTS.filter(p => p.categoria === cat && p.subcategoria).map(p => p.subcategoria))];
    }
    function buildCategoryNav() {
      document.getElementById("catNav").innerHTML = getCategories().map(c =>
        `<button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="selectCategory('${c.replace(/'/g, "\\'")}')">${c}</button>`
      ).join("");
    }
    function selectCategory(cat) {
      activeCategory = cat; activeSubcategory = null;
      buildCategoryNav(); buildSubcategoryBar(); renderProducts();
    }
    function buildSubcategoryBar() {
      const bar = document.getElementById("subcatBar");
      if (activeCategory === "Todos") { bar.classList.remove("show"); return; }
      const subs = getSubcategories(activeCategory);
      if (!subs.length) { bar.classList.remove("show"); return; }
      bar.classList.add("show");
      bar.innerHTML = `<button class="subcat-btn ${!activeSubcategory ? 'active' : ''}" onclick="selectSubcategory(null)">Todos</button>` +
        subs.map(s => `<button class="subcat-btn ${activeSubcategory === s ? 'active' : ''}" onclick="selectSubcategory('${s.replace(/'/g, "\\'")}')">${s}</button>`).join("");
    }
    function selectSubcategory(sub) { activeSubcategory = sub; buildSubcategoryBar(); renderProducts(); }

    function getFilteredProducts() {
      let prods = PRODUCTS.filter(p => p.ativo);
      const search = (document.getElementById("searchInput")?.value || "").toLowerCase();
      if (search) prods = prods.filter(p => p.nome.toLowerCase().includes(search) || p.descricao.toLowerCase().includes(search));
      if (activeCategory !== "Todos") prods = prods.filter(p => p.categoria === activeCategory);
      if (activeSubcategory) prods = prods.filter(p => p.subcategoria === activeSubcategory);
      prods.sort((a, b) => a.ordem - b.ordem);
      return prods;
    }
    function filterProducts() { renderProducts(); }

    function platformKey(p) {
      var nome = (p.plataforma || '').toLowerCase();
      if (nome.indexOf('shopee') !== -1) return 'shopee';
      if (nome.indexOf('amazon') !== -1) return 'amazon';
      if (nome.indexOf('mercado') !== -1 || nome.indexOf('meli') !== -1) return 'meli';
      if (nome.indexOf('tiktok') !== -1 || nome.indexOf('tik tok') !== -1) return 'tiktok';
      return '';
    }

    function platformBadgeHTML(p) {
      if (!p.plataforma) return '';
      var nome = p.plataforma.toLowerCase();
      var cls = '', icone = '';
      if (nome.indexOf('shopee') !== -1) { cls = ' badge-shopee'; icone = SHOPEE_BAG_SVG; }
      else if (nome.indexOf('tiktok') !== -1 || nome.indexOf('tik tok') !== -1) { cls = ' badge-tiktok'; icone = TIKTOK_SVG; }
      else if (nome.indexOf('amazon') !== -1) { cls = ' badge-amazon'; icone = AMAZON_SVG; }
      else if (nome.indexOf('mercado') !== -1 || nome.indexOf('meli') !== -1) { cls = ' badge-meli'; icone = MELI_SVG; }
      return '<span class="badge-platform' + cls + '">' + icone + p.plataforma + '</span>';
    }

    function videoUrlFix(u) {
      u = (u || '').trim();
      if (!u) return '';
      if (u.indexOf('http') !== 0) u = 'https://' + u;
      return u;
    }

    function videoButtonHTML(p) {
      var url = videoUrlFix(p.video);
      var inner = 'Vídeo<span class="video-play">' + PLAY_SVG + '</span>';
      if (url) {
        return '<a class="video-btn" href="' + url + '" target="_blank" rel="noopener noreferrer" title="Assistir vídeo" onclick="event.stopPropagation();">' + inner + '</a>';
      }
      // Sem link na planilha: não mostra o botão
      return '';
    }

    function productCardHTML(p) {
      var idx = PRODUCTS.indexOf(p);
      var hasPromo = p.precoPromo && p.precoPromo > 0 && p.preco > 0 && p.precoPromo < p.preco;
      var priceHTML = '';
      if (p.preco > 0) {
        var prefixo = p.tipo !== 'DIGITAL' ? '<span style="font-size:0.72rem;font-weight:500;color:var(--text-muted)">a partir de </span>' : '';
        priceHTML = '<div class="product-price"><span class="price-current">' + prefixo + 'R$ ' + fp(hasPromo ? p.precoPromo : p.preco) + '</span>' + (hasPromo ? '<span class="price-old">R$ ' + fp(p.preco) + '</span>' : '') + '</div>';
      }
      return '<div class="product-card">' +
        '<div class="product-img-wrap"><img src="' + p.img1 + '" alt="' + p.nome + '" loading="lazy" onerror="handleImgError(this)">' +
        (hasPromo ? '<span class="badge-promo">-' + Math.round((1 - p.precoPromo / p.preco) * 100) + '%</span>' : '') +
        platformBadgeHTML(p) +
        videoButtonHTML(p) +
        (ofertaExpiraEmBreve(p) ? '<span class="badge-limited">Oferta por tempo limitado</span>' : '') +
        '</div>' +
        '<div class="product-info">' +
        '<div class="product-cat">' + p.categoria + (p.subcategoria ? ' · ' + p.subcategoria : '') + '</div>' +
        '<div class="product-name">' + p.nome + '</div>' +
        priceHTML +
        // 🔥 ALTERAÇÃO AQUI: Botão transformado em link direto para o link de afiliado
        '<a href="' + p.linkAfiliado + '" target="_blank" rel="noopener noreferrer" class="btn-details' + (platformKey(p) ? ' btn-' + platformKey(p) : '') + '" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" onclick="event.stopPropagation(); registrarClique(PRODUCTS[' + idx + ']);">COMPRAR</a>' +
        '</div></div>';
    }

    function renderProducts() {
      var featuredSection = document.getElementById('featuredSection');
      var featuredGrid = document.getElementById('featuredGrid');
      var searchVal = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
      if (activeCategory === 'Todos' && !activeSubcategory && !searchVal) {
        var featured = PRODUCTS.filter(function(p) { return p.ativo && p.destaque; });
        featured.sort(function(a, b) { return a.ordem - b.ordem; });
        if (featured.length > 0) {
          featuredSection.style.display = 'block';
          featuredGrid.innerHTML = featured.map(productCardHTML).join('');
        } else { featuredSection.style.display = 'none'; }
      } else { featuredSection.style.display = 'none'; }
      const prods = getFilteredProducts();
      document.getElementById("sectionTitle").textContent = activeCategory === "Todos" ? "Todos os Achadinhos" : activeCategory;
      document.getElementById("productCount").textContent = `${prods.length} oferta${prods.length !== 1 ? 's' : ''}`;
      const grid = document.getElementById("productsGrid");
      if (!prods.length) {
        grid.innerHTML = `<div class="no-results"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg><p>Nenhum achadinho encontrado</p></div>`;
        return;
      }
      grid.innerHTML = prods.map(productCardHTML).join("");
    }

    function openProductModal(idx) {
      var toastEl = document.getElementById('toast');
      toastEl.classList.remove('show');
      clearTimeout(window._toastTimer);
      currentProduct = PRODUCTS[idx];
      const imgs = [currentProduct.img1, currentProduct.img2, currentProduct.img3, currentProduct.img4].filter(Boolean);
      document.getElementById("modalMainImg").src = imgs[0] || '';
      document.getElementById('modalMainImg').onerror = function() { handleImgError(this); };
      document.getElementById("galleryThumbs").innerHTML = imgs.length > 1 ? imgs.map((img, i) =>
        `<div class="gallery-thumb ${i === 0 ? 'active' : ''}" onclick="switchImage('${img}', this)"><img src="${img}" alt=""></div>`
      ).join("") : "";
      var catParts = [];
      if (currentProduct.plataforma) catParts.push(currentProduct.plataforma);
      if (currentProduct.tipo === 'DIGITAL') catParts.push('Digital');
      var catText = currentProduct.categoria + (currentProduct.subcategoria ? ' · ' + currentProduct.subcategoria : '');
      if (catText) catParts.push(catText);
      document.getElementById("modalCat").textContent = catParts.join(' · ');
      document.getElementById("modalName").textContent = currentProduct.nome;
      const hasPromo = currentProduct.precoPromo && currentProduct.precoPromo > 0 && currentProduct.preco > 0 && currentProduct.precoPromo < currentProduct.preco;
      var priceEl = document.getElementById('modalPrice');
      if (currentProduct.preco > 0) {
        var prefixo = currentProduct.tipo !== 'DIGITAL' ? '<span style="font-size:0.85rem;font-weight:500;color:var(--text-muted)">a partir de </span>' : '';
        priceEl.style.display = '';
        priceEl.innerHTML = prefixo + '<span class="price-current">R$ ' + fp(hasPromo ? currentProduct.precoPromo : currentProduct.preco) + '</span>' + (hasPromo ? '<span class="price-old">R$ ' + fp(currentProduct.preco) + '</span>' : '');
      } else {
        priceEl.style.display = 'none';
        priceEl.innerHTML = '';
      }
      document.getElementById("modalDesc").textContent = currentProduct.descricao;
      document.getElementById('modalCoupon').innerHTML = currentProduct.cupom
        ? '<div class="coupon-box"><div><div class="coupon-label">Cupom de desconto</div><div class="coupon-code">' + currentProduct.cupom + '</div></div><button class="coupon-copy" id="btnCopyCoupon" onclick="copyCoupon()">Copiar cupom</button></div>'
        : '';
      var embedUrl = ytEmbed(currentProduct.video);
      document.getElementById('modalVideo').innerHTML = embedUrl
        ? '<div class="video-embed"><iframe src="' + embedUrl + '" title="Vídeo do produto" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>'
        : '';
      document.getElementById('modalCta').textContent = ctaLabel(currentProduct);
      var note = document.getElementById('modalPriceNote');
      note.textContent = CONFIG.avisoPrecos || '';
      note.classList.toggle('show', currentProduct.preco > 0);
      document.getElementById("productModal").classList.add("open");
      document.body.style.overflow = "hidden";
      document.body.classList.add('modal-open');
      trackEvent('ViewContent', { name: currentProduct.nome, value: hasPromo ? currentProduct.precoPromo : currentProduct.preco });
    }
    function closeProductModal() {
      document.getElementById('productModal').classList.remove("open");
      document.body.style.overflow = '';
      document.body.classList.remove('modal-open');
    }
    function switchImage(src, el) { document.getElementById("modalMainImg").src = src; document.querySelectorAll(".gallery-thumb").forEach(t => t.classList.remove("active")); el.classList.add("active"); }

    // ============================================
    function ctaLabel(p) {
      if (p.textoBotao) return p.textoBotao;
      if (p.tipo === 'DIGITAL') return 'Quero conhecer →';
      return p.plataforma ? 'Ver oferta na ' + p.plataforma + ' →' : 'Ver oferta →';
    }

    function ctaClick() {
      if (!currentProduct) return;
      var hasPromo = currentProduct.precoPromo && currentProduct.precoPromo > 0 && currentProduct.preco > 0 && currentProduct.precoPromo < currentProduct.preco;
      registrarClique(currentProduct);
      trackEvent('ClickOferta', { name: currentProduct.nome, value: hasPromo ? currentProduct.precoPromo : currentProduct.preco });
      try {
        salvarClique(currentProduct.nome, currentProduct.categoria, currentProduct.plataforma);
      } catch(err) {}
      window.open(currentProduct.linkAfiliado, '_blank');
    }

    function copyCoupon() {
      if (!currentProduct || !currentProduct.cupom) return;
      var code = currentProduct.cupom;
      function done() {
        var btn = document.getElementById('btnCopyCoupon');
        if (btn) {
          btn.textContent = 'Copiado!';
          setTimeout(function() { btn.textContent = 'Copiar cupom'; }, 2500);
        }
        trackEvent('CopiaCupom', { name: currentProduct.nome });
      }
      navigator.clipboard.writeText(code).then(done).catch(function() {
        var t = document.createElement('textarea');
        t.value = code;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        done();
      });
    }

    function ytEmbed(url) {
      if (!url) return '';
      var m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      return m ? 'https://www.youtube.com/embed/' + m[1] : '';
    }

    function registrarClique(p) {
      if (typeof ACHADINHOS === 'undefined' || !ACHADINHOS.registrar_cliques) return;
      try {
        var utms = [];
        var params = new URLSearchParams(window.location.search);
        params.forEach(function(v, k) { if (k.toLowerCase().indexOf('utm_') === 0) utms.push(k + '=' + v); });
        var origem = [document.referrer, utms.join('&')].filter(Boolean).join(' | ');
        var dados = {
          dataHora: new Date().toLocaleString('pt-BR'),
          produto: p.nome,
          plataforma: p.plataforma,
          tipo: p.tipo,
          categoria: p.categoria,
          origem: origem
        };
        var url = ACHADINHOS.registrar_cliques + '?data=' + encodeURIComponent(JSON.stringify(dados));
        fetch(url, { mode: 'no-cors' });
      } catch (err) {
        console.log('Erro ao registrar clique:', err);
      }
    }

    // ============================================
    // HELPERS
    // ============================================
    function salvarClique(produto, categoria, plataforma) {
      if (!ACHADINHOS.registrar_cliques) return;

      if (!window._cliquesRegistrados) window._cliquesRegistrados = {};
      var chave = produto + '_' + plataforma;
      var agora = Date.now();
      if (window._cliquesRegistrados[chave] && (agora - window._cliquesRegistrados[chave]) < 300000) {
        return;
      }
      window._cliquesRegistrados[chave] = agora;

      try {
        var dados = {
          dataHora: new Date().toLocaleString('pt-BR'),
          produto: produto,
          categoria: categoria,
          plataforma: plataforma
        };
        var img = new Image();
        img.src = ACHADINHOS.registrar_cliques + '?data=' + encodeURIComponent(JSON.stringify(dados));
      } catch (err) {}
    }

      var input = document.getElementById('searchInput');
      input.value = '';
      filterProducts();
      document.getElementById('searchClear').classList.remove('show');
      input.focus();

          searchBar.classList.remove('mobile-open');

      }
    });

    function abrirAdminLogin() {

      document.getElementById('adminSenha').value = '';
      document.getElementById('adminErro').classList.remove('show');
      document.getElementById('adminOverlay').classList.add('open');

    function fecharAdminLogin() {

    function enviarAdminLogin(e) {
      if (e) e.preventDefault();
      var email = document.getElementById('adminEmail').value.trim().toLowerCase();
      var senha = document.getElementById('adminSenha').value.split('').filter(function(c) { return c >= '0' && c <= '9'; }).join('');
      var d = new Date();
      var hoje = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
      var emailOk = CONFIG.email && email === String(CONFIG.email).trim().toLowerCase();
      if (emailOk && senha === hoje) {
        window.location.href = 'https://selbstor.github.io/admin.html';
      } else {
        document.getElementById('adminErro').classList.add('show');
      }
      return false;
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharAdminLogin();
    });
    function nameToHex(name) {
      var paletas = {
        'azul': '#2563EB',
        'verde': '#2A5C3F',
        'vermelho': '#DC2626',
        'roxo': '#7C3AED',
        'rosa': '#DB2777',
        'laranja': '#EA580C',
        'dourado': '#B8860B',
        'preto': '#1B1B1B',
        'marrom': '#78350F',
        'turquesa': '#0D9488'
      };
      return paletas[name.toLowerCase().trim()] || null;
    }
    function darkenColor(hex, factor) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var r = Math.round(parseInt(hex.substr(0, 2), 16) * factor);
      var g = Math.round(parseInt(hex.substr(2, 2), 16) * factor);
      var b = Math.round(parseInt(hex.substr(4, 2), 16) * factor);
      return '#' + ('0'+r.toString(16)).slice(-2) + ('0'+g.toString(16)).slice(-2) + ('0'+b.toString(16)).slice(-2);
    }
    function isLightColor(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var r = parseInt(hex.substr(0, 2), 16);
      var g = parseInt(hex.substr(2, 2), 16);
      var b = parseInt(hex.substr(4, 2), 16);
      var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55;
    }
    function handleImgError(img) {
      var parent = img.parentElement;
      var div = document.createElement('div');
      div.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0eeea;color:#a8a49c;gap:8px';
      div.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M6.75 7.5a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg><span style="font-size:0.75rem;font-weight:500">Sem foto</span>';
      parent.replaceChild(div, img);
    }

    function toSlug(text) {
      return text.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function copyProductLink() {
      if (!currentProduct) return;
      var slug = toSlug(currentProduct.nome);
      var url = window.location.origin + window.location.pathname + '?produto=' + slug;
      navigator.clipboard.writeText(url).then(function() {
        var btn = document.getElementById('btnCopyLink');
        var txt = document.getElementById('copyLinkText');
        btn.classList.add('copied');
        txt.textContent = 'Link Copiado!';
        setTimeout(function() {
          btn.classList.remove('copied');
          txt.textContent = 'Compartilhar';
        }, 2500);
      }).catch(function() {
        var textarea = document.createElement('textarea');
        textarea.value = window.location.origin + window.location.pathname + '?produto=' + toSlug(currentProduct.nome);
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        var btn = document.getElementById('btnCopyLink');
        var txt = document.getElementById('copyLinkText');
        btn.classList.add('copied');
        txt.textContent = 'Link Copiado!';
        setTimeout(function() {
          btn.classList.remove('copied');
          txt.textContent = 'Compartilhar';
        }, 2500);
      });
    }

      if (CONFIG.pixelFacebook) {
        const fb = document.createElement('script');
        fb.textContent = "!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','" + CONFIG.pixelFacebook + "');fbq('track','PageView');";
        document.head.appendChild(fb);
      }
      if (CONFIG.googleAnalytics) {
        const gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.googleAnalytics;
        document.head.appendChild(gaScript);

          document.head.appendChild(adsScript);

    function trackEvent(eventName, data) {
      if (CONFIG.pixelFacebook && typeof fbq !== 'undefined') {
        if (eventName === 'ViewContent') fbq('track', 'ViewContent', { content_name: data.name, value: data.value, currency: 'BRL' });
        else if (eventName === 'ClickOferta') fbq('track', 'Lead', { content_name: data.name, value: data.value, currency: 'BRL' });
        else if (eventName === 'CopiaCupom') fbq('trackCustom', 'CopiaCupom', { content_name: data.name });
      }
      if (CONFIG.googleAnalytics && typeof gtag !== 'undefined') {
        if (eventName === 'ViewContent') gtag('event', 'view_item', { currency: 'BRL', value: data.value });
        else if (eventName === 'ClickOferta') gtag('event', 'click_oferta', { item_name: data.name, currency: 'BRL', value: data.value });
        else if (eventName === 'CopiaCupom') gtag('event', 'copy_coupon', { item_name: data.name });
      }
      if (CONFIG.googleAds && typeof gtag !== 'undefined') {
        if (eventName === 'ClickOferta') gtag('event', 'conversion', { send_to: CONFIG.googleAds, value: data.value, currency: 'BRL' });
      }
    }

    function bannerFilter(value) {
      let categoria, subcategoria = null;
      if (value.includes('>')) {
        const parts = value.split('>');
        categoria = parts[0].trim();
        subcategoria = parts[1].trim();
      } else {
        categoria = value.trim();
      }
      selectCategory(categoria);
      if (subcategoria) {
        activeSubcategory = subcategoria;
        buildSubcategoryBar();
      }
    }
    function fixImg(url) {
      if (!url) return '';
      let m = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
      if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
      m = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
      if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
      m = url.match(/drive\.google\.com\/uc\?.*id=([^&]+)/);
      if (m) return 'https://lh3.googleusercontent.com/d/' + m[1];
      return url;
    }
    function fp(v) { return v.toFixed(2).replace(".", ","); }
    function parsePrecoBR(val) {
      var s = (val || '').trim();
      if (!s) return 0;
      if (s.indexOf(',') !== -1) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
      return parseFloat(s) || 0;
    }
    function showToast(text, priority) {
      var el = document.getElementById('toast');
      document.getElementById('toastImg').style.display = 'none';
      document.getElementById('toastTitle').textContent = text;
      document.getElementById('toastSubtitle').textContent = '';
      if (priority) {
        el.style.zIndex = '600';
      } else {
        el.style.zIndex = '';
      }
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(function() { el.classList.remove('show'); el.style.zIndex = ''; }, 3000);
    }
    function toggleMobileSearch() { document.getElementById("searchBar").classList.toggle("mobile-open"); }

    window.addEventListener('scroll', function() {
      var btn = document.getElementById('backToTop');
      if (btn) {
        if (window.scrollY > 400) { btn.classList.add('show'); }
        else { btn.classList.remove('show'); }
      }
    });

          return;

        applyConfig();
